plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def buildVersionCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()

// ---------------------------------------------------------------------------
// FIRMA
// Nessuna password e nessun keystore dentro il repository. Le credenziali si
// leggono, in ordine:
//   1) dalle variabili d'ambiente  -> usate dalla CI, valorizzate dai GitHub Secrets
//   2) dal file keystore.properties -> resta sul tuo PC, e' nel .gitignore
// Se non c'e' nessuna delle due, il progetto compila lo stesso: debug e release
// vengono firmati con la chiave di debug standard di Android.
//
// IMPORTANTE: se hai gia' distribuito APK firmati con scopa.keystore, configura
// i secret (vedi README) altrimenti la firma cambia e chi ha gia' l'app dovra'
// disinstallarla prima di aggiornare.
// ---------------------------------------------------------------------------
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def ksFile        = file(System.getenv("KEYSTORE_FILE")     ?: keystoreProps.getProperty("storeFile", "scopa.keystore"))
def ksStorePass   = System.getenv("KEYSTORE_PASSWORD")      ?: keystoreProps.getProperty("storePassword")
def ksAlias       = System.getenv("KEY_ALIAS")              ?: keystoreProps.getProperty("keyAlias")
def ksKeyPass     = System.getenv("KEY_PASSWORD")           ?: keystoreProps.getProperty("keyPassword")
def canSign       = ksFile.exists() && ksStorePass && ksAlias && ksKeyPass

android {
    namespace 'com.zis.scopa'
    compileSdk 34

    defaultConfig {
        applicationId "com.zis.scopa"
        minSdk 24
        targetSdk 34
        versionCode buildVersionCode
        versionName "2.8"
    }

    signingConfigs {
        if (canSign) {
            common {
                storeFile ksFile
                storePassword ksStorePass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        debug {
            if (canSign) signingConfig signingConfigs.common
        }
        release {
            if (canSign) {
                signingConfig signingConfigs.common
            } else {
                logger.lifecycle("ZiS: nessun keystore configurato -> build firmato con la chiave di debug.")
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { viewBinding true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
