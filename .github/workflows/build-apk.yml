name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # I secret vengono portati in env a livello di job: il contesto "secrets"
    # non e' utilizzabile dentro le condizioni "if", "env" invece si'.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Ripristina il keystore dai GitHub Secrets, se configurati.
      # Se il secret non c'e' lo step viene saltato e si firma con la chiave di debug.
      - name: Restore keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/scopa.keystore

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ZiS-GiochiDiCarte.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZiS-GiochiDiCarte
          path: app/build/outputs/apk/debug/ZiS-GiochiDiCarte.apk
          if-no-files-found: error

      # Il keystore non deve restare sul runner
      - name: Cleanup keystore
        if: always()
        run: rm -f app/scopa.keystore
