name: Build

on:
  push:
    # Solo il ramo principale: prima bastava spingere un ramo di prova per far partire una
    # build completa e consumare minuti per un APK che nessuno avrebbe scaricato.
    branches: [main]
    # Niente build per le modifiche che non toccano l'app. Le tre voci coprono tutto
    # quello che nel repository NON entra nell'APK:
    #   **.md      README e note
    #   **.txt     le istruzioni di caricamento
    #   art/**     gli script che generano carte, dorsi, loghi e icone
    #   verifica/** il porting in Python delle regole del Klondike, che serve a provarle
    #              fuori dall'app e non viene compilato da nessuno
    # verifica/ mancava: un push che toccava solo quei file faceva partire una build
    # intera di release, APK e AAB compresi, per poi buttare via tutto.
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'art/**'
      - 'verifica/**'
  # Anche sulle pull request, e serve a una cosa precisa: le proposte di Dependabot
  # arrivano come PR, e senza questa riga non venivano compilate. Il primo tentativo di
  # aggiornare le librerie e' fallito su un numero di versione che pretendeva un'AGP piu'
  # nuova - un guasto che una build sulla PR avrebbe mostrato prima di unire, gratis.
  #
  # Nelle PR di Dependabot i secret non ci sono, per scelta di GitHub: la firma ripiega
  # sulla chiave di debug come previsto in build.gradle, e la build serve solo a rispondere
  # "compila o no".
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'art/**'
      - 'verifica/**'
  workflow_dispatch:

# Due push ravvicinati facevano partire due build intere, e quella vecchia continuava a girare
# per produrre un artefatto gia' superato. Con questo la precedente viene annullata e resta
# solo l'ultima. Il gruppo include il ref, quindi build su rami diversi non si annullano fra loro.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # I secret vengono portati in env a livello di job: il contesto "secrets"
    # non e' utilizzabile dentro le condizioni "if", "env" invece si'.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}

    # Versioni delle action: tutte quelle qui sotto girano su Node 24.
    # GitHub ha smesso di supportare il runtime Node 20 e da giugno 2026 forza comunque le
    # action a Node 24, quindi la build funzionava lo stesso ma con due avvisi a ogni run.
    # Per upload-artifact la v5 non bastava - dichiarava ancora runs.using node20 - e la
    # prima a girare su Node 24 di serie e' stata la v6.
    #
    # Da qui in avanti sono alla v7, e le due novita' contano entrambe:
    #
    #  - upload-artifact v7 aggiunge "archive: false" per i file SINGOLI: l'artefatto non
    #    viene piu' compresso e prende il nome del file. E' quello che fa scaricare
    #    direttamente ZiS-GiochiDiCarte.apk invece di un .zip da scompattare prima di
    #    installarlo sul telefono. Vale per APK e AAB; NON per i referti di R8, che sono un
    #    jolly su piu' file, e dove il parametro farebbe fallire il passo.
    #
    #  - checkout v7 rifiuta di scaricare il codice di una pull request proveniente da un
    #    fork quando il workflow e' innescato da pull_request_target o workflow_run: sono i
    #    due trigger con cui si combinano i "pwn request". Qui non si usano ne' l'uno ne'
    #    l'altro - solo push e pull_request - quindi il cambiamento non tocca niente, ma e'
    #    il motivo per cui vale la pena stare sulla major nuova invece che restare indietro.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # La v4 porta anche i cmdline-tools 20.0 al posto dei precedenti: e' l'unica modifica
      # di comportamento del gruppo, e va nella direzione giusta perche' servono a scaricare
      # la piattaforma API 36.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Ripristina il keystore dai GitHub Secrets, se configurati, e lo verifica subito.
      #
      # La verifica non e' pignoleria: senza, un secret incollato a meta' produce un file
      # troncato, base64 -d non se ne accorge (i byte che ha sono validi) e l'errore salta
      # fuori solo un minuto dopo, dentro packageRelease, come "KeytoolException ... null"
      # con sotto un java.io.EOFException. Illeggibile, e sembra un problema di password
      # mentre invece il file e' semplicemente corto. Meglio fermarsi qui in due secondi
      # dicendo cosa non va.
      - name: Restore keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          # tr toglie spazi e a capo che possono essersi infilati nel copia-incolla
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > app/scopa.keystore
          size=$(stat -c%s app/scopa.keystore)
          echo "keystore ricostruito: $size byte"
          if [ "$size" -lt 1000 ]; then
            echo "::error title=Keystore incompleto::Il file ricostruito e' di soli $size byte, quindi il secret KEYSTORE_BASE64 e' stato incollato a meta'. Cancellalo e riscrivilo per intero: deve essere una riga sola."
            exit 1
          fi
          if ! keytool -list -keystore app/scopa.keystore \
                       -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error title=Keystore non apribile::Il file e' completo ma non si apre. Controlla KEYSTORE_PASSWORD e KEY_ALIAS: l'alias deve essere scritto esattamente come sta nel keystore."
            exit 1
          fi
          echo "keystore verificato: file integro, alias e password corretti"

      - name: Avviso firma
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::warning title=Nessun keystore configurato::APK e AAB saranno firmati con una chiave di debug diversa a ogni build. L'APK si installa lo stesso per le prove, l'AAB invece il Play Console lo rifiuta. Configura i secret KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Un'unica invocazione: le due varianti condividono compilazione e risorse,
      # quindi il bundle costa pochi secondi in piu' rispetto al solo APK.
      - name: Build APK and AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      # mv e non cp: con cp restavano due file identici nella stessa cartella e l'unico
      # effetto era il dubbio, guardando la cartella, su quale dei due fosse quello buono.
      #
      # Adesso si rinomina anche l'AAB, e non e' un vezzo: con "archive: false" il nome
      # dell'artefatto NON lo decide piu' il campo name, lo decide il nome del file. Senza
      # questa riga, nella pagina del run l'AAB comparirebbe come "app-release.aab", cioe'
      # con lo stesso nome che ha il bundle di qualunque altra app al mondo.
      - name: Rename APK and AAB
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/ZiS-GiochiDiCarte.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/ZiS-GiochiDiCarte.aab

      # APK: da installare a mano sul telefono per le prove.
      #
      # archive: false -> si scarica il .apk e non un .zip che lo contiene. Il campo name
      # con questo parametro viene ignorato (l'artefatto prende il nome del file, cioe'
      # ZiS-GiochiDiCarte.apk); lo lascio scritto perche' se un domani il parametro non
      # venisse applicato - runner vecchio, ritorno a una major precedente - l'artefatto
      # tornerebbe a chiamarsi come prima invece che "artifact".
      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ZiS-GiochiDiCarte-APK
          path: app/build/outputs/apk/release/ZiS-GiochiDiCarte.apk
          archive: false
          if-no-files-found: error

      # AAB: il formato che il Play Console richiede per pubblicare
      - name: Upload AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ZiS-GiochiDiCarte-AAB
          path: app/build/outputs/bundle/release/ZiS-GiochiDiCarte.aab
          archive: false
          if-no-files-found: error

      # I referti di R8. Da quando minifyEnabled e' acceso, i nomi delle classi nel release
      # sono offuscati: senza mapping.txt una stack trace di Android vitals e' una sequenza
      # di a.b.c e non si risale a niente. Nell'AAB il mapping ci finisce dentro da solo,
      # quindi per il Play Store si e' coperti; per l'APK che si installa a mano no, ed e'
      # esattamente il caso in cui si sta provando.
      #
      # Nella stessa cartella AGP scrive anche usage.txt, cioe' l'elenco di quello che ha
      # tolto: e' il modo per vedere se R8 sta lavorando davvero invece di dedurlo dal peso
      # del file. Da qui il jolly, che prende tutto quello che c'e'.
      #
      # if-no-files-found: warn e non error, perche' se un giorno minifyEnabled tornasse
      # false la cartella non esisterebbe e la build non deve fallire per questo.
      #
      # Qui NIENTE archive: false, ed e' il solo passo dei tre in cui non ci va: il percorso
      # e' un jolly che prende piu' file (mapping.txt, usage.txt, seeds.txt, ...) e il
      # caricamento diretto gestisce un file solo, quindi il passo fallirebbe. Questi tre o
      # quattro file zippati stanno benissimo: non si installano, si aprono quando serve
      # leggere una stack trace offuscata.
      - name: Upload referti R8
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ZiS-GiochiDiCarte-R8
          path: app/build/outputs/mapping/release/*
          if-no-files-found: warn

      # Il keystore non deve restare sul runner
      - name: Cleanup keystore
        if: always()
        run: rm -f app/scopa.keystore
