org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# R8, in caso di guai.
#
# Dalla AGP 8.0 R8 gira in modalita' aggressiva di serie: assume che non ci sia riflessione
# e ottimizza di conseguenza. Per quest'app e' vero (vedi app/proguard-rules.pro), ma se
# dopo aver acceso minifyEnabled qualcosa si rompesse SOLO nel build di release, la prima
# cosa da provare - prima di scrivere regole - e' togliere di mezzo la modalita' aggressiva
# levando il cancelletto qui sotto:
#
# android.enableR8.fullMode=false
